# UC Tor: one workflow that does everything
#  1) apply-zip : when you upload a .zip to the repo, it extracts it and replaces the project files
#  2) bridges   : every hour, collects fresh Tor bridges and publishes them to the "bridges" branch
#  3) build     : creates the signing key once (reused forever), builds APKs, publishes a Release
# Do NOT rename this file: the version number of the app comes from its run counter.
name: UC Tor

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: build
        options: [build, bridges, both]

permissions:
  contents: write

concurrency:
  group: uctor-${{ github.event_name == 'schedule' && 'bridges' || 'main' }}
  cancel-in-progress: false

jobs:
  apply-zip:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

      - name: Extract uploaded zip and replace project files
        id: apply
        shell: bash
        env:
          HAS_PAT: ${{ secrets.WORKFLOW_TOKEN != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip upload/*.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip uploaded, nothing to apply."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          command -v rsync >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rsync; }
          git config user.name "uctor-bot"
          git config user.email "uctor-bot@users.noreply.github.com"
          stash="$RUNNER_TEMP/zips"; mkdir -p "$stash"
          for z in "${zips[@]}"; do mv "$z" "$stash/"; done
          for z in "$stash"/*.zip; do
            echo "::group::Applying $(basename "$z")"
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            src="$tmp"
            mapfile -t top < <(find "$tmp" -mindepth 1 -maxdepth 1 ! -name '__MACOSX')
            if [ ${#top[@]} -eq 1 ] && [ -d "${top[0]}" ]; then src="${top[0]}"; fi
            excludes=(--exclude '.git/' --exclude 'signing/' --exclude '*.zip' --exclude '__MACOSX/')
            if [ "$HAS_PAT" != "true" ]; then
              excludes+=(--exclude '.github/workflows/')
              if [ -d "$src/.github/workflows" ] && ! diff -rq "$src/.github/workflows" .github/workflows >/dev/null 2>&1; then
                echo "::warning::فایل‌های .github/workflows داخل زیپ تغییر کرده‌اند ولی بدون Secret به نام WORKFLOW_TOKEN، گیت‌هاب اجازه‌ی جایگزینی آن‌ها را نمی‌دهد. آن فایل را دستی ویرایش کنید."
              fi
            fi
            rsync -a --delete "${excludes[@]}" "$src"/ ./
            echo "::endgroup::"
          done
          git add -A
          if git diff --cached --quiet; then
            echo "Zip contained no changes."
          else
            git commit -q -m "Apply uploaded zip [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"

  bridges:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task != 'build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect bridges
        run: |
          if [ ! -f tools/collect_bridges.py ]; then echo "Project not uploaded yet."; exit 0; fi
          python3 tools/collect_bridges.py --out "$RUNNER_TEMP/bridges-out"
      - name: Publish to "bridges" branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          out="$RUNNER_TEMP/bridges-out"
          [ -f "$out/bridges.json" ] || exit 0
          cd "$out"
          git init -q
          git checkout -q -b bridges
          git add -A
          git -c user.name="uctor-bot" -c user.email="uctor-bot@users.noreply.github.com" commit -q -m "Update bridges $(date -u +%FT%TZ) [skip ci]"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bridges

  build:
    needs: [apply-zip, bridges]
    if: >-
      always() &&
      github.event_name != 'schedule' &&
      (needs.apply-zip.result == 'success' || needs.apply-zip.result == 'skipped') &&
      (needs.bridges.result == 'success' || needs.bridges.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.task != 'bridges')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check project
        id: check
        run: |
          if [ -f settings.gradle.kts ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::هنوز فایل زیپ پروژه آپلود نشده است."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v5
        if: steps.check.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.ok == 'true'
        with:
          gradle-version: "8.11.1"

      - name: Install Android build platform
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Signing key (created once, then reused)
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: bash tools/signing.sh

      - name: Embed latest bridges into the APK
        if: steps.check.outputs.ok == 'true'
        run: |
          if git fetch -q --depth 1 origin bridges 2>/dev/null; then
            git show FETCH_HEAD:bridges.json > "$RUNNER_TEMP/b.json" &&
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/b.json" &&
            cp "$RUNNER_TEMP/b.json" app/src/main/assets/bridges.json && echo "Embedded fresh bridges."
          else
            echo "No bridges branch yet, using the bundled fallback list."
          fi

      - name: Add whole-device VPN tunnel (hev-socks5-tunnel)
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/libs
          URL=$(gh api repos/heiher/hev-socks5-tunnel/releases/latest --jq '.assets[] | select(.name | endswith(".aar")) | .browser_download_url' | head -n 1 || true)
          if [ -z "$URL" ]; then
            echo "::error::hev-socks5-tunnel AAR was not found in the latest release."
            exit 1
          fi
          curl -fL --retry 3 "$URL" -o app/libs/hev-socks5-tunnel.aar
          unzip -l app/libs/hev-socks5-tunnel.aar | grep -q 'hev-socks5-tunnel' || { echo "::error::Downloaded tunnel AAR is invalid"; exit 1; }

      - name: Build APKs (new + old phones)
        if: steps.check.outputs.ok == 'true'
        run: |
          VC=$(( 100 + ${{ github.run_number }} ))
          gradle --no-daemon --stacktrace \
            -PversionCode=$VC -PversionName=1.0.${{ github.run_number }} \
            -PbridgeRepo=${GITHUB_REPOSITORY} \
            :app:assembleRelease

      - name: Rename APKs
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p dist
          V=1.0.${{ github.run_number }}
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk); abi=${n#app-}; abi=${abi%-release}
            case "$abi" in
              arm64-v8a)   label="arm64-v8a_new-phones" ;;
              armeabi-v7a) label="armeabi-v7a_old-phones" ;;
              universal)   label="universal_all-phones" ;;
              *)           label="$abi" ;;
            esac
            cp "$f" "dist/UC-Tor-v${V}-${label}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: UC-Tor-v1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cat > notes.md <<'NOTES'
          **کدام فایل را نصب کنم؟**
          - `arm64-v8a_new-phones` : بیشتر گوشی‌های جدید (۶۴ بیتی)
          - `armeabi-v7a_old-phones` : گوشی‌های قدیمی (۳۲ بیتی)
          - `universal_all-phones` : روی همه‌ی گوشی‌ها نصب می‌شود (حجم بیشتر)

          همه‌ی نسخه‌ها با یک کلید امضا شده‌اند و روی نسخه‌ی قبلی نصب می‌شوند. حداقل اندروید ۷.
          NOTES
          gh release create "$TAG" dist/*.apk --title "UC Tor $TAG" --notes-file notes.md --target "$(git rev-parse HEAD)"
